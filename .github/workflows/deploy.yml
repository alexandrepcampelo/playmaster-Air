name: PlayMaster Air - validar e publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playmaster-air-production
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar estrutura da interface
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          html = Path("index.html").read_text()
          if 'class="now frame"' in html:
            for section in ("PlayMaster Air", "PLAYLIST", "ÚLTIMAS", "BOTONEIRA", "DECK 1", "DECK 2"):
              assert section in html, f"Seção visual ausente: {section}"
            assert html.count('class="playlist-row"') == 15, "A playlist de demonstração deve mostrar 15 faixas."
            assert html.count('class="key"') == 18, "A botoneira deve mostrar 18 botões."
            assert re.search(r'src="/air-integration\.js(?:\?[^\"]*)?"', html), "Módulo de integração do Air ausente."
            integration = Path("air-integration.js").read_text()
            assert "/api/library?" in integration and "/api/library/" in integration, "Integração do catálogo/áudio ausente."
            assert "/api/me" in integration and "/api/login" in integration, "Verificação de sessão ausente."
            Path("/tmp/playmaster-air-app.js").write_text(integration)
            parser = HTMLParser()
            parser.feed(html)
          else:
            assert html.count('class="bar" data-slot=') == 8, "A tela deve conter oito faixas."
            assert 'class="header" aria-label="Cabeçalho superior"' in html
            if 'id="categorySelect"' in html:
              assert html.count('<option>') == 10, "O seletor deve conter as dez categorias do Auto Import."
            assert 'class="toolbar" id="globalToolbar" aria-label="Barra global de ferramentas" aria-hidden="true"' in html
            assert html.count('class="toolbar-button"') == 18, "A barra global deve conter dezoito botões."
            assert html.count('class="column-toolbar-toggle"') == 3, "As três colunas com atalho devem abrir a barra global."
            assert "/api/library?" in html and "/api/library/" in html
            assert '"/engine-api/api/engine/mix-rules"' in html, "Integração de mixagem do Engine ausente."
            script = re.search(r"<script>([\\s\\S]*?)</script>", html)
            assert script, "JavaScript principal ausente."
            Path("/tmp/playmaster-air-app.js").write_text(script.group(1))
            parser = HTMLParser()
            parser.feed(html)
          PY
          if [ -f /tmp/playmaster-air-app.js ]; then node --check /tmp/playmaster-air-app.js; fi
          node --check service-worker.js
          node --check air-integration.js

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar configuração de publicação
        id: config
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          AIR_DEPLOY_PATH: ${{ secrets.AIR_DEPLOY_PATH }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ] || [ -z "$AIR_DEPLOY_PATH" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Deploy aguardando secrets VPS_HOST, VPS_USER, VPS_SSH_KEY e AIR_DEPLOY_PATH no repositório."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Preparar acesso SSH
        if: steps.config.outputs.ready == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${VPS_PORT:-2222}" -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Copiar arquivos estáticos
        if: steps.config.outputs.ready == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          AIR_DEPLOY_PATH: ${{ secrets.AIR_DEPLOY_PATH }}
        run: |
          REMOTE_PATH=$(printf '%q' "$AIR_DEPLOY_PATH")
          ssh -p "${VPS_PORT:-2222}" "$VPS_USER@$VPS_HOST" "AIR_DEPLOY_PATH=$REMOTE_PATH bash -s" <<'REMOTE'
          set -e
          if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo"; fi
          $SUDO mkdir -p "$AIR_DEPLOY_PATH"
          $SUDO chown -R "$(id -un)" "$AIR_DEPLOY_PATH"
          $SUDO chmod 755 "$AIR_DEPLOY_PATH"
          REMOTE
          rsync -az --delete -e "ssh -p ${VPS_PORT:-2222}" \
            index.html air-integration.js manifest.webmanifest service-worker.js playmaster-logo.png.heic playmaster-logo.png.png \
            "$VPS_USER@$VPS_HOST:$AIR_DEPLOY_PATH/"
      - name: Configurar Nginx, HTTPS e proxy protegido para o Auto Import
        if: steps.config.outputs.ready == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          AIR_DEPLOY_PATH: ${{ secrets.AIR_DEPLOY_PATH }}
        run: |
          REMOTE_PATH=$(printf '%q' "$AIR_DEPLOY_PATH")
          ssh -p "${VPS_PORT:-2222}" "$VPS_USER@$VPS_HOST" "AIR_DEPLOY_PATH=$REMOTE_PATH bash -s" <<'REMOTE'
          set -euo pipefail
          DOMAIN=air.apcgestor.com.br
          ROUTE=/etc/nginx/sites-available/playmaster-air-apcgestor
          if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo"; fi
          $SUDO mkdir -p /var/www/acme
          cat > /tmp/playmaster-air-nginx.conf <<'NGINX'
          server {
              listen 80;
              listen [::]:80;
              server_name air.apcgestor.com.br;
              root __AIR_DEPLOY_PATH__;
              index index.html;
              location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
              location = /engine-api/api/engine/mix-rules {
                  limit_except GET { deny all; }
                  proxy_pass http://127.0.0.1:3200/api/engine/mix-rules;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  add_header Cache-Control "no-store" always;
              }
              location = /traffic-api/next-block {
                  limit_except GET { deny all; }
                  proxy_pass http://127.0.0.1:3000/api/air/next-block;
                  proxy_http_version 1.1;
                  proxy_set_header Host traffic.apcgestor.com.br;
                  proxy_set_header Origin https://air.apcgestor.com.br;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
                  add_header Cache-Control "no-store" always;
              }
              location ^~ /api/ { return 503; }
              location / { try_files $uri $uri/ /index.html; }
          }
          NGINX
          sed "s|__AIR_DEPLOY_PATH__|$AIR_DEPLOY_PATH|g" /tmp/playmaster-air-nginx.conf > /tmp/playmaster-air-nginx.ready
          $SUDO install -m 644 /tmp/playmaster-air-nginx.ready "$ROUTE"
          $SUDO ln -sfn "$ROUTE" /etc/nginx/sites-enabled/playmaster-air-apcgestor
          $SUDO install -d -o root -g root -m 700 /etc/nginx/snippets
          if [ ! -f /etc/nginx/snippets/playmaster-auto-import-auth.conf ]; then
            $SUDO install -o root -g root -m 600 /dev/null /etc/nginx/snippets/playmaster-auto-import-auth.conf
          fi
          $SUDO nginx -t
          $SUDO systemctl restart nginx
          if command -v certbot >/dev/null 2>&1 && getent ahostsv4 "$DOMAIN" >/dev/null 2>&1; then
            $SUDO certbot certonly --webroot -w /var/www/acme -d "$DOMAIN" --non-interactive --agree-tos --register-unsafely-without-email || true
          fi
          AIR_CERT="/etc/letsencrypt/live/$DOMAIN/fullchain.pem"
          if [ -s "$AIR_CERT" ]; then
            AIR_SAN="$($SUDO openssl x509 -in "$AIR_CERT" -noout -ext subjectAltName 2>/dev/null || true)"
            echo "SAN do certificado armazenado para o Air:"
            echo "$AIR_SAN"
            if ! printf '%s' "$AIR_SAN" | grep -Fq "DNS:$DOMAIN"; then
              echo "O certificado existente não cobre $DOMAIN; emitindo um certificado específico para o Air."
              $SUDO certbot certonly --webroot -w /var/www/acme --cert-name "$DOMAIN" -d "$DOMAIN" --force-renewal --non-interactive --agree-tos --register-unsafely-without-email
              AIR_SAN="$($SUDO openssl x509 -in "$AIR_CERT" -noout -ext subjectAltName 2>/dev/null || true)"
            fi
            if ! printf '%s' "$AIR_SAN" | grep -Fq "DNS:$DOMAIN"; then
              echo "O certificado do Air ainda não inclui $DOMAIN."
              exit 1
            fi
          fi
          if [ -s "/etc/letsencrypt/live/$DOMAIN/fullchain.pem" ] && [ -s "/etc/letsencrypt/live/$DOMAIN/privkey.pem" ]; then
            python3 - "$AIR_DEPLOY_PATH" <<'PY'
          from pathlib import Path
          import sys
          root=sys.argv[1]
          body=f"""server {{
              listen 80;
              listen [::]:80;
              server_name air.apcgestor.com.br;
              location ^~ /.well-known/acme-challenge/ {{ root /var/www/acme; }}
              location / {{ return 301 https://$host$request_uri; }}
          }}
          server {{
              listen 443 ssl default_server;
              listen [::]:443 ssl default_server;
              server_name air.apcgestor.com.br;
              root {root};
              index index.html;
              ssl_certificate /etc/letsencrypt/live/air.apcgestor.com.br/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/air.apcgestor.com.br/privkey.pem;
              location = /engine-api/api/engine/mix-rules {{
                  limit_except GET {{ deny all; }}
                  proxy_pass http://127.0.0.1:3200/api/engine/mix-rules;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
                  add_header Cache-Control "no-store" always;
              }}
              location = / {{
                  add_header Cache-Control "no-store, no-cache, must-revalidate" always;
                  try_files /index.html =404;
              }}
              location = /index.html {{
                  add_header Cache-Control "no-store, no-cache, must-revalidate" always;
                  try_files $uri =404;
              }}
              location = /service-worker.js {{
                  add_header Cache-Control "no-store, no-cache, must-revalidate" always;
                  try_files $uri =404;
              }}
              location = /traffic-api/next-block {{
                  limit_except GET {{ deny all; }}
                  proxy_pass http://127.0.0.1:3000/api/air/next-block;
                  proxy_http_version 1.1;
                  proxy_set_header Host traffic.apcgestor.com.br;
                  proxy_set_header Origin https://air.apcgestor.com.br;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
                  add_header Cache-Control "no-store" always;
              }}
              location ^~ /api/ {{
                  include /etc/nginx/snippets/playmaster-auto-import-auth.conf;
                  proxy_pass http://127.0.0.1:3600;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
                  proxy_set_header Range $http_range;
                  proxy_set_header If-Range $http_if_range;
                  proxy_read_timeout 300;
              }}
              location / {{ try_files $uri $uri/ /index.html; }}
          }}
          """
          Path("/tmp/playmaster-air-nginx-tls.ready").write_text(body)
          PY
            $SUDO install -m 644 /tmp/playmaster-air-nginx-tls.ready "$ROUTE"
            $SUDO nginx -t
            $SUDO systemctl restart nginx
          fi
          if [ -s "/etc/letsencrypt/live/$DOMAIN/fullchain.pem" ] && [ -s "/etc/letsencrypt/live/$DOMAIN/privkey.pem" ]; then
            echo "Configuração Nginx ativa para o Air:"
            $SUDO cat "$ROUTE"
            echo "Certificado selecionado com SNI do Air:"
            echo "Listeners ativos na porta 443:"
            $SUDO ss -ltnp | grep -E ":443\\b" || true
            echo "Diretivas TLS carregadas pelo Nginx:"
            $SUDO nginx -T 2>&1 | grep -E "(^# configuration file|listen .*443|server_name (air|studio)\\.apcgestor\\.com\\.br|ssl_certificate(_key)? )" || true
            timeout 10 openssl s_client -connect 127.0.0.1:443 -servername "$DOMAIN" </dev/null 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName
            echo "Verificando página Air por HTTPS..."
            curl --connect-timeout 8 --max-time 20 -fsS "https://$DOMAIN/" | grep -F "PlayMaster Air" >/dev/null
            echo "Verificando HTML recém-publicado..."
            LIVE_HTML="$(curl --connect-timeout 8 --max-time 20 -fsS -H "Cache-Control: no-cache" "https://$DOMAIN/")"
            if printf '%s' "$LIVE_HTML" | grep -Fq 'class="now frame"'; then
              KEY_COUNT="$(printf '%s' "$LIVE_HTML" | grep -o 'class="key"' | wc -l)"
              echo "Botões encontrados: $KEY_COUNT (esperado: 18)"
              [ "$KEY_COUNT" -eq 18 ]
            else
              echo "Verificando controles da interface..."
              printf '%s' "$LIVE_HTML" | grep -Fq "pause-cue-delete-button"
            fi
            echo "Verificando saúde do Auto Import..."
            curl --connect-timeout 8 --max-time 20 -fsS "https://$DOMAIN/api/health" | grep -F "playmaster-auto-import" >/dev/null
            echo "Verificando regras do motor..."
            curl --connect-timeout 8 --max-time 20 -fsS "https://$DOMAIN/engine-api/api/engine/mix-rules" | grep -F '"rules"' >/dev/null
          else
            curl --connect-timeout 8 --max-time 20 -fsS -H "Host: $DOMAIN" http://127.0.0.1/ | grep -F "PlayMaster Air" >/dev/null
          fi
          REMOTE
