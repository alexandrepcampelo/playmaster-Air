<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#323232">
<title>PlayMaster Air</title>
</head>
<body>
<div id="preview-oito-barras-em-tres-partes" aria-label="Oito barras, cada uma dividida em três partes nas proporções 15, 70 e 15 por cento">
  <style>
    #preview-oito-barras-em-tres-partes {
      width: 100%;
      width: 100%;
      height: 100dvh;
      min-height: 520px;
      display: grid;
      grid-template-rows: 72px minmax(0, 1fr) 68px;
      background: #323232;
      color: #f1f1f1;
      font: 500 14px/1.4 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #323232; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    #preview-oito-barras-em-tres-partes * { box-sizing: border-box; }
    #preview-oito-barras-em-tres-partes .header { background: #292929; border-bottom: 2px solid #bdbdbd; }
    #preview-oito-barras-em-tres-partes .columns {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      padding: 10px;
      background: #323232;
    }
    #preview-oito-barras-em-tres-partes .column {
      min-width: 0;
      background: #292929;
      border: 1px solid #575757;
      border-radius: 0;
    }
    #preview-oito-barras-em-tres-partes .column:first-child { grid-column: span 2; }
    #preview-oito-barras-em-tres-partes .playlist {
      display: grid;
      grid-template-rows: repeat(8, minmax(0, 1fr));
      gap: 5px;
      padding: 8px;
    }
    #preview-oito-barras-em-tres-partes .bar {
      min-height: 0;
      display: grid;
      grid-template-columns: 15fr 70fr 15fr;
      gap: 4px;
      padding: 0;
    }
    #preview-oito-barras-em-tres-partes .bar-part {
      min-width: 0;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 0;
      appearance: none;
      border: 0;
      border-radius: 0;
      color: #c8cdd3;
      background: linear-gradient(180deg, #1d5a8d 0%, #0d365b 48%, #061b30 100%);
      box-shadow: inset 0 1px 0 #ffffff45, inset 0 -2px 3px #000000a8;
    }
    #preview-oito-barras-em-tres-partes .bar-part:nth-child(2) {
      background: linear-gradient(180deg, #292929 0%, #111 45%, #030303 100%);
      box-shadow: inset 0 1px 0 #ffffff3b, inset 0 -2px 3px #000000c9;
    }
    #preview-oito-barras-em-tres-partes .track-info {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px 12px;
      text-align: left;
      font-size: clamp(11px, 1.1vw, 15px);
      line-height: 1.2;
    }
    #preview-oito-barras-em-tres-partes .track-line {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    #preview-oito-barras-em-tres-partes .track-title {
      font-weight: 700;
      color: #f0f0f0;
    }
    #preview-oito-barras-em-tres-partes .track-artist {
      color: #bfc5cc;
    }
    #preview-oito-barras-em-tres-partes .track-time {
      flex: 0 0 auto;
      color: #f0f0f0;
      font-weight: 500;
      white-space: nowrap;
    }
    #preview-oito-barras-em-tres-partes .play-control {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 0;
      color: #c8cdd3;
      cursor: pointer;
    }
    #preview-oito-barras-em-tres-partes .play-control i {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 29px;
      height: 29px;
      color: #c8cdd3;
    }
    #preview-oito-barras-em-tres-partes .play-control svg {
      width: 25px !important;
      height: 25px !important;
      fill: currentColor;
      stroke: currentColor;
      stroke-width: 1.5;
      opacity: 1;
    }
    #preview-oito-barras-em-tres-partes .double-play {
      display: grid;
      place-items: center;
      color: #c8cdd3;
    }
    #preview-oito-barras-em-tres-partes .double-play svg {
      width: 42px;
      height: 42px;
      fill: currentColor;
      stroke: none;
    }
    #preview-oito-barras-em-tres-partes .double-play svg circle {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
    }
    #preview-oito-barras-em-tres-partes .toolbar { background: #242424; border-top: 2px solid #555; }
    @media (max-width: 680px) {
      #preview-oito-barras-em-tres-partes { min-height: 520px; grid-template-rows: 54px minmax(0, 1fr) 54px; }
      #preview-oito-barras-em-tres-partes .columns { gap: 5px; padding: 6px; }
      #preview-oito-barras-em-tres-partes .playlist { gap: 3px; padding: 5px; }
      #preview-oito-barras-em-tres-partes .bar { gap: 3px; }
      #preview-oito-barras-em-tres-partes .track-info { padding: 4px 6px; font-size: 10px; }
      #preview-oito-barras-em-tres-partes .double-play svg { width: 32px; height: 32px; }
      #preview-oito-barras-em-tres-partes .play-control svg { width: 20px !important; height: 20px !important; }
    }
  </style>
