<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#323232">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<title>PlayMaster Air</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#323232;color:#f1f1f1}
button{font:inherit;color:inherit}
#air{width:100%;height:100dvh;min-height:520px;display:grid;grid-template-rows:0 minmax(0,1fr) 68px;background:#323232;font-size:14px;line-height:1.35}
.header{display:flex;align-items:center;justify-content:center;padding:0 14px;background:#292929;border-bottom:2px solid #bdbdbd}
.category-select{width:min(260px,70vw);height:38px;padding:0 12px;border:1px solid #666;border-radius:0;background:#171717;color:#f1f1f1;font:inherit;font-weight:600;text-align:center}
.columns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:10px;background:#323232;min-height:0}
.column{min-width:0;min-height:0;background:#292929;border:1px solid #575757;border-radius:0}
.column:first-child{grid-column:span 2}
.playlist{display:grid;grid-template-rows:repeat(8,minmax(0,1fr));gap:5px;padding:8px;overflow:auto}
.bar{min-height:0;display:grid;grid-template-columns:15fr 70fr 15fr;gap:4px}
.part{position:relative;min-width:0;width:100%;height:100%;padding:0;border:0;border-radius:0;appearance:none;color:#c8cdd3;display:grid;place-items:center;background:linear-gradient(180deg,#1d5a8d 0%,#0d365b 48%,#061b30 100%);box-shadow:inset 0 1px 0 #ffffff45,inset 0 -2px 3px #000000a8}
.part:nth-child(2){background:linear-gradient(180deg,#292929 0%,#111 45%,#030303 100%);box-shadow:inset 0 1px 0 #ffffff3b,inset 0 -2px 3px #000000c9}
.play{cursor:pointer}.play:disabled{opacity:1;cursor:default}
.play svg{width:25px;height:25px;fill:currentColor;stroke:currentColor}
.info{display:flex!important;flex-direction:column;justify-content:space-between;align-items:stretch;padding:8px 12px;text-align:left;font-size:clamp(11px,1.1vw,15px);line-height:1.2;overflow:hidden}
.info-line{width:100%;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.track-title,.track-artist{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track-title{font-weight:700;color:#f0f0f0}
.track-artist{color:#bfc5cc}
.track-time{flex:0 0 auto;color:#f0f0f0;font-variant-numeric:tabular-nums;white-space:nowrap}
.fast{color:#c8cdd3}
.fast svg{width:42px;height:42px;fill:currentColor;stroke:none}
.fast svg circle{fill:none;stroke:currentColor;stroke-width:1.5}
.toolbar{background:#242424;border-top:2px solid #555}
.soundboard-panel{display:flex;min-width:0;min-height:0;padding:8px;overflow:hidden;background:#292929}
.soundboard-grid{width:100%;height:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));gap:7px;overflow:auto}
.soundboard-button{min-width:0;min-height:0;padding:4px;border:1px solid #68717a;border-radius:0;appearance:none;background:linear-gradient(180deg,#737d87 0%,#555e67 52%,#3b4249 100%);color:#f1f3f5;font:inherit;font-size:clamp(12px,1.25vw,17px);font-weight:700;box-shadow:inset 0 1px 0 #ffffff55,inset 0 -3px 5px #15191dbb,0 1px 2px #0008}
.soundboard-button:hover{background:linear-gradient(180deg,#818b95 0%,#626b74 52%,#464d55 100%)}
.soundboard-button:active{background:linear-gradient(180deg,#444b53,#707a84);box-shadow:inset 0 2px 5px #10141999}
.catalog-panel{display:flex;flex-direction:column;overflow:hidden;padding:0;background:linear-gradient(145deg,#082d4b 0%,#061f36 48%,#031321 100%);border-color:#17608f;box-shadow:inset 0 1px 0 #63caff55,inset 0 -3px 8px #000b,0 0 14px #007dca33}
.catalog-heading{height:38px;flex:none;margin:0;padding:9px 10px;border-bottom:1px solid #17608f;background:linear-gradient(180deg,#10436b,#08243c);color:#e8f7ff;font-size:12px;font-weight:600;letter-spacing:.08em;text-shadow:0 0 8px #36bfff66}
.catalog-categories{flex:0 1 40%;min-height:140px;overflow:auto;padding:4px 0;border-bottom:1px solid #555}
.catalog-category{width:100%;min-height:28px;display:grid;grid-template-columns:17px minmax(0,1fr) auto;gap:7px;align-items:center;padding:3px 9px;border:0;border-radius:0;background:transparent;color:#e2e2e2;text-align:left;font:inherit;font-size:clamp(11px,1vw,13px)}
.catalog-category:hover{background:#3b3b3b}
.catalog-category.selected{background:#124a74;color:#fff}
.catalog-category svg{width:15px;height:13px;fill:none;stroke:#a8c5d9;stroke-width:1.5;stroke-linejoin:round}
.catalog-category.selected svg{stroke:#e8f5ff}
.catalog-category small{color:#aeb4b9;font-size:11px}
.catalog-search{height:36px;min-height:36px;display:flex;align-items:center;gap:7px;padding:0 9px;border-bottom:1px solid #555;background:#1c1c1c;color:#becbd3}
.catalog-search>span{font-size:21px;line-height:1}
.catalog-search input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:#f1f1f1;font:inherit;font-size:12px}
.catalog-search input::placeholder{color:#aaa}
.catalog-files{flex:1;min-height:0;overflow:auto;background:linear-gradient(180deg,#061a2b,#041321)}
.catalog-file{min-height:39px;display:grid;grid-template-columns:minmax(0,1fr) auto 25px;gap:2px 6px;align-items:center;padding:5px 7px 5px 9px;border-bottom:1px solid #14527c;background:linear-gradient(180deg,#0b3150,#061a2b);color:#eef9ff;font-size:12px;box-shadow:inset 0 1px 0 #54bfff22}
.catalog-file-add{grid-column:3;grid-row:1/3;width:25px;height:28px;padding:3px;border:1px solid transparent;border-radius:0;background:transparent;color:#d8e8f2;display:grid;place-items:center;cursor:pointer}
.catalog-file-add svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square}
.catalog-file-add:hover{border-color:#4bbce9;background:#0c3e61;color:#fff}
.catalog-file-add[aria-pressed="true"]{color:#61d5ff;text-shadow:0 0 8px #35c5ff;box-shadow:inset 0 0 10px #1399d055}
.catalog-file-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catalog-file-artist{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#acb2b7;font-size:11px}
.catalog-file-time{grid-column:2;grid-row:1/3;color:#c8cdd1;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:11px}
.catalog-empty{padding:10px;color:#afb3b6;font-size:12px}

.sync-note{position:fixed;left:50%;bottom:82px;z-index:8;transform:translate(-50%,10px);opacity:0;pointer-events:none;background:#111a25;border:1px solid #2471a8;color:#e9f4fc;padding:9px 14px;font-size:13px;transition:.18s;max-width:min(90vw,520px);text-align:center}
.sync-note.show{opacity:1;transform:translate(-50%,0)}
.login-shade{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:20px;background:#0009}
.login-shade.show{display:grid}
.login-box{width:min(390px,100%);padding:22px;background:#141414;border:1px solid #727272;border-radius:0;box-shadow:0 18px 55px #000b}
.login-box h1{margin:0 0 8px;font-size:20px}
.login-box p{margin:0 0 18px;color:#c3c7cc;font-size:13px}
.login-box label{display:block;margin:12px 0 5px;font-size:12px;color:#d0d5db}
.login-box input{width:100%;height:42px;padding:0 10px;border:1px solid #60656c;border-radius:0;background:#08090b;color:#fff}
.login-actions{display:flex;gap:8px;margin-top:17px}
.login-actions button{flex:1;min-height:40px;border:1px solid #35648a;border-radius:0;background:#123e68;color:#fff}
.login-actions .secondary{background:#222;border-color:#555}
.login-error{min-height:18px;margin-top:9px;color:#ff9a9f;font-size:12px}
@media(max-width:680px){
 #air{min-height:520px;grid-template-rows:0 minmax(0,1fr) 54px}
 .columns{gap:5px;padding:6px}
 .playlist{gap:3px;padding:5px}
 .bar{gap:3px}
 .info{padding:4px 6px;font-size:10px}
 .fast svg{width:32px;height:32px}
 .play svg{width:20px;height:20px}
}
@media(max-height:650px){#air{grid-template-rows:0 minmax(0,1fr) 48px}.playlist{gap:3px;padding:5px}.info{padding-top:4px;padding-bottom:4px}}
</style>
</head>

    <button class="catalog-category" type="button" role="option" aria-selected="false" data-category="Chamadas"><svg viewBox="0 0 20 16" aria-hidden="true"><path d="M1.5 3.5h6l2 2h9v9h-17z"/></svg><span>Chamadas</span><small>0</small></button>
    <button class="catalog-category" type="button" role="option" aria-selected="false" data-category="Locução"><svg viewBox="0 0 20 16" aria-hidden="true"><path d="M1.5 3.5h6l2 2h9v9h-17z"/></svg><span>Locução</span><small>0</small></button>
    <button class="catalog-category" type="button" role="option" aria-selected="false" data-category="Hora Certa"><svg viewBox="0 0 20 16" aria-hidden="true"><path d="M1.5 3.5h6l2 2h9v9h-17z"/></svg><span>Hora Certa</span><small>0</small></button>
    <button class="catalog-category" type="button" role="option" aria-selected="false" data-category="Temperatura"><svg viewBox="0 0 20 16" aria-hidden="true"><path d="M1.5 3.5h6l2 2h9v9h-17z"/></svg><span>Temperatura</span><small>0</small></button>
    <button class="catalog-category" type="button" role="option" aria-selected="false" data-category="Outros"><svg viewBox="0 0 20 16" aria-hidden="true"><path d="M1.5 3.5h6l2 2h9v9h-17z"/></svg><span>Outros</span><small>0</small></button>
  </div>
  <label class="catalog-search"><span aria-hidden="true">⌕</span><input id="catalogSearch" type="search" placeholder="Buscar arquivo..." aria-label="Buscar arquivo"></label>
  <div class="catalog-files" id="catalogFiles" aria-live="polite"></div>
</section>
  </main>
  <footer class="toolbar" aria-label="Barra de ferramentas inferior"></footer>
</div>

<div class="sync-note" id="syncNote" role="status" aria-live="polite"></div>
<div class="login-shade" id="loginShade">
  <form class="login-box" id="loginForm">
    <h1>Conectar ao Auto Import</h1>
    <p>Entre com o usuário do painel do Auto Import. As faixas serão sincronizadas e salvas neste dispositivo para reprodução local.</p>
    <label for="username">Usuário</label><input id="username" autocomplete="username" required>
    <label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required>
    <div class="login-actions"><button type="submit">Conectar e sincronizar</button><button class="secondary" type="button" id="offlineButton">Usar faixas salvas</button></div>
    <div class="login-error" id="loginError"></div>
  </form>
</div>
<audio id="audioPlayer" preload="none"></audio>
<script>
const DB_NAME="playmaster-air-library";
const STORE="tracks";
const rows=Array.from(document.querySelectorAll(".bar"));
const categories=["Músicas","Comerciais","Vinhetas","Intercons","Trilhas","Chamadas","Locução","Hora Certa","Temperatura","Outros"];

const catalogButtons=Array.from(document.querySelectorAll(".catalog-category"));
const catalogFiles=document.querySelector("#catalogFiles");
const catalogSearch=document.querySelector("#catalogSearch");
let catalogTracks=[];
const note=document.querySelector("#syncNote");
const loginShade=document.querySelector("#loginShade");
const loginError=document.querySelector("#loginError");
const audio=document.querySelector("#audioPlayer");
let library=[];
let activeIndex=-1;
let windowStart=0;
let activeCategory=localStorage.getItem("playmaster-air-category")||"Músicas";
let activeCatalogCategory=localStorage.getItem("playmaster-air-catalog-category")||activeCategory;
let activeUrl="";
let activeDeck=0;
let engineMixRules=[];
let pendingMix=null;
let scheduledMixIndex=-1;
let audioContext=null;
let audioDecks=[audio,null];
let audioGains=[null,null];
let deckUrls=[null,null];
let databasePromise;

function notify(message){
  note.textContent=message;
  note.classList.add("show");
  clearTimeout(notify.timer);
  notify.timer=setTimeout(()=>note.classList.remove("show"),2600);
}
function openDb(){
  if(databasePromise)return databasePromise;
  databasePromise=new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,1);
    req.onupgradeneeded=()=>req.result.createObjectStore(STORE,{keyPath:"id"});
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
  return databasePromise;
}
async function dbAll(){
  const db=await openDb();
  return new Promise((resolve,reject)=>{
    const req=db.transaction(STORE,"readonly").objectStore(STORE).getAll();
    req.onsuccess=()=>resolve(req.result||[]);
    req.onerror=()=>reject(req.error);
  });
}
async function dbPut(item){
  const db=await openDb();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readwrite");
    tx.objectStore(STORE).put(item);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  });
}
async function dbDeleteExcept(keep){
  const db=await openDb();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readwrite");
    const req=tx.objectStore(STORE).getAllKeys();
    req.onsuccess=()=>req.result.forEach(key=>{if(!keep.has(key))tx.objectStore(STORE).delete(key)});
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  });
}
function formatAudioTime(seconds){
  const n=Math.max(0,Math.floor(Number(seconds)||0));
  return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0");
}
function formatPredicted(seconds){
  const n=Math.max(0,Math.floor(Number(seconds)||0));
  const h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
function renderCatalog(){
  const query=(catalogSearch.value||"").trim().toLocaleLowerCase("pt-BR");
  const categoryTracks=catalogTracks.filter(item=>item.category===activeCatalogCategory);
  catalogButtons.forEach(button=>{
    const selected=button.dataset.category===activeCatalogCategory;
    button.classList.toggle("selected",selected);
    button.setAttribute("aria-selected",String(selected));
    const categoryCount=catalogTracks.filter(item=>item.category===button.dataset.category).length;
    button.querySelector("small").textContent=String(categoryCount);
  });
  const matches=categoryTracks.filter(item=>[item.title,item.fileName,item.artist].some(value=>String(value||"").toLocaleLowerCase("pt-BR").includes(query)));
  catalogFiles.replaceChildren();
  if(!matches.length){const empty=document.createElement("div");empty.className="catalog-empty";empty.textContent=query?"Nenhum arquivo encontrado":"Nenhum áudio nesta categoria";catalogFiles.append(empty);return}
  matches.forEach(item=>{
    const row=document.createElement("div");row.className="catalog-file";
    const title=document.createElement("span");title.className="catalog-file-name";title.textContent=item.title||item.fileName||"Áudio";
    const artist=document.createElement("span");artist.className="catalog-file-artist";artist.textContent=item.artist||"";
    const duration=document.createElement("span");duration.className="catalog-file-time";duration.textContent=formatAudioTime(item.duration);
    const inPlaylist=library.some(track=>String(track.id)===String(item.id));
    const add=document.createElement("button");add.type="button";add.className="catalog-file-add";add.setAttribute("aria-pressed",String(inPlaylist));
    add.setAttribute("aria-label",(inPlaylist?"Selecionado no playlist: ":"Selecionar para o playlist: ")+(item.title||item.fileName||"áudio"));
    add.setAttribute("aria-disabled",String(inPlaylist));
    add.title=inPlaylist?"Selecionado no playlist":"Adicionar ao playlist";
    add.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>';
    add.addEventListener("click",()=>addCatalogTrackToPlaylist(item));
    row.append(title,artist,duration,add);catalogFiles.append(row);
  });
}
function render(){
  rows.forEach((row,index)=>{
    const globalIndex=windowStart+index;
    const item=library[globalIndex];
    row.querySelector(".track-title").textContent=item?(item.title||item.fileName||""):"";
    row.querySelector(".track-artist").textContent=item?(item.artist||""):"";
    row.querySelector(".audio-time").textContent=item?formatAudioTime(item.duration):"";
    row.querySelector(".predicted-time").textContent=item?formatPredicted(library.slice(0,globalIndex).reduce((sum,track)=>sum+(Number(track.duration)||0),0)):"";
    row.querySelector(".play").setAttribute("aria-label",item?"Tocar "+(item.title||item.fileName):"Faixa vazia");
    row.querySelector(".play").disabled=!item;
  });
}
function addCatalogTrackToPlaylist(item){
  if(library.some(track=>String(track.id)===String(item.id))){notify("Esta faixa já está no playlist.");return;}
  if(library.length>=rows.length){notify("O playlist já está com as 8 faixas preenchidas.");return;}
  library.push(item);
  localStorage.setItem("playmaster-air-playlist",JSON.stringify(library.map(track=>track.id)));
  render();renderCatalog();notify("Faixa adicionada ao playlist.");
}
async function loadLocal(){
  const local=await dbAll();
  catalogTracks=local;
  let selectedIds=[];
  try{selectedIds=JSON.parse(localStorage.getItem("playmaster-air-playlist")||"[]")}catch{}
  library=Array.isArray(selectedIds)?selectedIds.map(id=>local.find(item=>String(item.id)===String(id))).filter(Boolean):[];
  render();
  renderCatalog();
}
async function requestJson(path,options={}){
  const response=await fetch(path,{...options,credentials:"same-origin",cache:"no-store"});
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(data.error||"Falha na comunicação com o Auto Import.");
  return data;
}
async function fetchAudio(item){
  const response=await fetch(item.audioUrl,{credentials:"same-origin",cache:"no-store"});
  if(!response.ok)throw new Error("Não foi possível baixar "+(item.fileName||"um áudio")+" do Engine.");
  return response.blob();
}
async function loadEngineMixRules(){try{const config=await requestJson("/engine-api/api/engine/mix-rules");engineMixRules=Array.isArray(config.rules)?config.rules:[]}catch(error){engineMixRules=[];console.warn("Configurações de mixagem do Engine indisponíveis:",error)}}
function engineCategory(item){
 const value=String(item?.category||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
 const map={musica:"musica",musicas:"musica",comercial:"comercial",comerciais:"comercial",vinheta:"vinheta",vinhetas:"vinheta",intercon:"intercon",intercons:"intercon",trilha:"trilha",trilhas:"trilha",chamada:"chamada",chamadas:"chamada",locucao:"locucao","hora certa":"hora-certa",temperatura:"temperatura",outros:"outros",outro:"outros"};
 return map[value]||value;
}
function mixRuleFor(fromItem,toItem){return engineMixRules.find(rule=>rule.from===engineCategory(fromItem)&&rule.to===engineCategory(toItem))||null}
function bindAudioDeck(deck,index){
 if(deck.dataset.airBound)return;deck.dataset.airBound="true";
 deck.addEventListener("ended",()=>finishAudioDeck(index));
 deck.addEventListener("timeupdate",()=>{if(index===activeDeck)checkEngineTransition()});
 deck.addEventListener("error",()=>notify("Não foi possível reproduzir este áudio salvo."));
}
function ensureAudioDecks(){
 const AudioContextClass=window.AudioContext||window.webkitAudioContext;if(audioDecks[1])return;
 const second=new Audio();second.preload="auto";second.setAttribute("playsinline","");document.body.append(second);audioDecks[1]=second;bindAudioDeck(second,1);
 if(!AudioContextClass)return;
 try{audioContext=new AudioContextClass();audioDecks.forEach((deck,index)=>{const source=audioContext.createMediaElementSource(deck),gain=audioContext.createGain();source.connect(gain).connect(audioContext.destination);audioGains[index]=gain})}catch(error){audioContext=null;audioGains=[null,null]}
}
function setDeckVolume(index,value){const gain=audioGains[index];if(gain){gain.gain.cancelScheduledValues(audioContext.currentTime);gain.gain.setValueAtTime(value,audioContext.currentTime)}}
async function audioForTrack(item,index){
 let blob=item.audioBlob;if(!blob){if(!navigator.onLine)throw new Error("Esta faixa ainda não está salva neste dispositivo. Conecte-se para baixá-la.");blob=await fetchAudio(item);try{await dbPut({...item,audioBlob:blob})}catch(error){if(error?.name==="QuotaExceededError")throw new Error("O armazenamento deste dispositivo está cheio. Libere espaço para salvar este áudio.");throw error}await acknowledge(item);library[index]={...item,audioBlob:blob}}return blob
}
function setDeckSource(index,blob){if(deckUrls[index])URL.revokeObjectURL(deckUrls[index]);deckUrls[index]=URL.createObjectURL(blob);audioDecks[index].src=deckUrls[index]}

async function acknowledge(item){
  if(item.deliveries?.studio?.status==="synced")return;
  await requestJson("/api/library/"+encodeURIComponent(item.id)+"/ack",{
    method:"POST",headers:{"content-type":"application/json"},
    body:JSON.stringify({consumer:"studio",status:"synced",message:"Arquivo salvo localmente no PlayMaster Air."})
  });
}
async function syncLibrary(){
  let items=[];
  let allCategoriesComplete=true;
  const byCategory=new Map();
  for(const category of categories){
    const {items:categoryItems=[]}=await requestJson("/api/library?category="+encodeURIComponent(category)+"&limit=500");
    byCategory.set(category,categoryItems);
    items.push(...categoryItems.map(item=>({...item,category:item.category||category})));
    if(categoryItems.length>=500)allCategoriesComplete=false;
  }
  const existing=await dbAll();
  const map=new Map(existing.map(item=>[item.id,item]));
  const keep=new Set(items.map(item=>item.id));
  const categoryPositions=new Map();
  let updated=0;
  for(const item of items){
    const categoryIndex=categoryPositions.get(item.category)||0;
    categoryPositions.set(item.category,categoryIndex+1);
    const cached=map.get(item.id);
    let audioBlob=cached?.audioBlob;
    const needsAudio=item.category===activeCategory&&categoryIndex<rows.length&&(!audioBlob||cached?.checksum!==item.checksum);
    if(needsAudio){audioBlob=await fetchAudio(item);updated++}
    const saved={...item,...(audioBlob?{audioBlob}:{})};
    try{await dbPut(saved)}catch(error){
      if(error?.name==="QuotaExceededError")throw new Error("O armazenamento deste dispositivo está cheio. Libere espaço para sincronizar os áudios.");
      throw error;
    }
    if(audioBlob&&(needsAudio||item.deliveries?.studio?.status!=="synced"))await acknowledge(item);
  }
  if(allCategoriesComplete)await dbDeleteExcept(keep);
  await loadLocal();
  notify(updated?updated+" áudio(s) sincronizado(s) em "+activeCategory+".":"Categorias do Auto Import sincronizadas.");
  return items.length;
}
async function playTrack(globalIndex){
 const item=library[globalIndex];if(!item)return;
 try{ensureAudioDecks();if(audioContext?.state==="suspended")await audioContext.resume();for(const deck of audioDecks){if(deck){deck.pause();deck.currentTime=0}}pendingMix=null;scheduledMixIndex=-1;activeDeck=0;setDeckVolume(0,1);setDeckVolume(1,0);setDeckSource(0,await audioForTrack(item,globalIndex));activeIndex=globalIndex;await audioDecks[0].play()}catch(error){notify(error.message||"Toque novamente para iniciar o áudio.")}
}
async function beginEngineTransition(rule){
 const nextIndex=activeIndex+1;if(nextIndex>=library.length||scheduledMixIndex===nextIndex)return;scheduledMixIndex=nextIndex;
 try{ensureAudioDecks();if(audioContext?.state==="suspended")await audioContext.resume();const blob=await audioForTrack(library[nextIndex],nextIndex),nextDeck=1-activeDeck;audioDecks[nextDeck].pause();audioDecks[nextDeck].currentTime=0;setDeckSource(nextDeck,blob);setDeckVolume(nextDeck,rule.mode==="crossfade"?0:1);await audioDecks[nextDeck].play();
 if(rule.mode==="crossfade"&&audioContext&&audioGains[activeDeck]&&audioGains[nextDeck]){const now=audioContext.currentTime,fade=Math.max(0,Math.min(Number(rule.fadeSeconds)||0,Number(rule.overlapSeconds)||0));setDeckVolume(activeDeck,1);setDeckVolume(nextDeck,0);if(fade>0){audioGains[activeDeck].gain.linearRampToValueAtTime(0,now+fade);audioGains[nextDeck].gain.linearRampToValueAtTime(1,now+fade)}else{setDeckVolume(activeDeck,0);setDeckVolume(nextDeck,1)}}pendingMix={index:nextIndex,deck:nextDeck}
 }catch(error){scheduledMixIndex=-1;notify("A mixagem do Engine não iniciou a próxima faixa: "+(error.message||"tente novamente."))}
}
async function finishAudioDeck(deckIndex){
 if(deckIndex!==activeDeck)return;if(pendingMix){const previous=activeDeck;activeDeck=pendingMix.deck;activeIndex=pendingMix.index;audioDecks[previous].pause();setDeckVolume(previous,0);setDeckVolume(activeDeck,1);pendingMix=null;scheduledMixIndex=-1;if(activeIndex>=windowStart+rows.length){windowStart=activeIndex;render()}return}
 const next=activeIndex+1;if(next<library.length){if(next>=windowStart+rows.length){windowStart=next;render()}scheduledMixIndex=-1;await playTrack(next)}
}
function checkEngineTransition(){
 if(activeIndex<0||!audioDecks[activeDeck])return;const nextIndex=activeIndex+1;if(nextIndex>=library.length)return;const rule=mixRuleFor(library[activeIndex],library[nextIndex]);if(!rule||!["crossfade","overlay"].includes(rule.mode))return;const overlap=Math.max(0,Number(rule.overlapSeconds)||0),remaining=audioDecks[activeDeck].duration-audioDecks[activeDeck].currentTime;if(overlap>0&&remaining<=overlap)beginEngineTransition(rule)
}
async function checkSession(){
  try{
    await requestJson("/api/me");
    loginShade.classList.remove("show");
  }catch(error){
    loginShade.classList.add("show");
    loginError.textContent="";
    return false;
  }
  try{await syncLibrary()}catch(error){notify(error.message)}
  await selectCatalogCategory(activeCatalogCategory);
  return true;
}
document.querySelector("#loginForm").addEventListener("submit",async event=>{
  event.preventDefault();
  const button=event.currentTarget.querySelector('button[type="submit"]');
  button.disabled=true;
  loginError.textContent="";
  try{
    await requestJson("/api/login",{
      method:"POST",
      headers:{"content-type":"application/json"},
      body:JSON.stringify({username:document.querySelector("#username").value,password:document.querySelector("#password").value})
    });
    loginShade.classList.remove("show");
    try{await syncLibrary()}catch(error){notify(error.message)}
    await selectCatalogCategory(activeCatalogCategory);
  }catch(error){
    loginError.textContent=error.message;
  }finally{
    button.disabled=false;
  }
});
document.querySelector("#offlineButton").addEventListener("click",()=>{
  loginShade.classList.remove("show");
  notify(library.length?"Reprodução com as faixas salvas neste dispositivo.":"Nenhuma faixa sincronizada neste dispositivo.");
});
async function selectCatalogCategory(category){
  activeCatalogCategory=category;
  localStorage.setItem("playmaster-air-catalog-category",category);
  catalogSearch.value="";
  renderCatalog();
  try{
    const {items=[]}=await requestJson("/api/library?category="+encodeURIComponent(category)+"&limit=500");
    const cached=new Map(catalogTracks.map(item=>[item.id,item]));
    const refreshed=items.map(item=>({...cached.get(item.id),...item,category:item.category||category}));
    catalogTracks=[...catalogTracks.filter(item=>item.category!==category),...refreshed];
    renderCatalog();
  }catch(error){
    // Keep showing the locally cached list when Auto Import is offline.
  }
}
catalogButtons.forEach(button=>button.addEventListener("click",()=>{
  selectCatalogCategory(button.dataset.category);
}));
catalogSearch.addEventListener("input",renderCatalog);
rows.forEach((row,index)=>row.querySelector(".play").addEventListener("click",()=>playTrack(windowStart+index)));
audioDecks.forEach((deck,index)=>{if(deck)bindAudioDeck(deck,index)});
loadEngineMixRules();loadLocal().then(()=>checkSession()).catch(()=>{loginShade.classList.add("show")});
setInterval(()=>{if(navigator.onLine)loadEngineMixRules()},60000);
setInterval(()=>{if(navigator.onLine)checkSession()},300000);
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("/service-worker.js").catch(()=>{});
</script>
</body>
